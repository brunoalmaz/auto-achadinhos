<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assopra Fitas · Achadinhos</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23D4246C'/%3E%3Cpath d='M14 16h36a3 3 0 0 1 3 3v29a3 3 0 0 1-3 3H14a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3z' fill='%231F1E1A'/%3E%3Crect x='18' y='22' width='28' height='14' rx='2' fill='%23EDECE8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17160f;--card:#211f19;--card2:#2a2820;--line:#35322a;--fg:#EDECE8;--mut:#9a978d;
  --pink:#D4246C;--pink2:#e8538f;--ok:#3fb67b;--warn:#e0a43a;--bad:#e0524f;
  --r:14px;--gap:14px;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:radial-gradient(1200px 600px at 85% -10%,rgba(212,36,108,.18),transparent 60%),var(--bg);color:var(--fg);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:30px;letter-spacing:-.5px}
h1 em{color:var(--pink);font-style:italic}
.atual{color:var(--mut);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);margin-bottom:var(--gap)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:900px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}}
@media(max-width:520px){.c3{grid-column:span 12}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rot{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.val{font-size:26px;font-weight:700;line-height:1.1;display:flex;align-items:center;gap:8px}
.val small{font-size:15px;color:var(--mut);font-weight:500}
.sub{font-size:12px;color:var(--mut);min-height:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(63,182,123,.15)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.barra{height:6px;background:var(--card2);border-radius:9px;overflow:hidden}.barra i{display:block;height:100%;width:0;background:var(--pink);transition:width .5s}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;font-size:13px;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:#55514a;background:#312e26}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}.btn.pri:hover:not(:disabled){background:var(--pink2)}
.btn.warn{color:var(--warn)}.btn.okc{color:var(--ok)}
.btn.ic{padding:9px 11px}
.btn.min{padding:5px 10px;font-size:12px}
.sep{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.q{color:var(--mut);white-space:nowrap;font-size:12px;width:1%}
td.p{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);background:rgba(63,182,123,.12)}.tag.bad{color:var(--bad);background:rgba(224,82,79,.12)}.tag.pk{color:var(--pink2);background:rgba(212,36,108,.14)}
.lista{display:flex;flex-direction:column}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .d{font-size:12px;color:var(--mut);margin-top:2px;display:flex;gap:6px;align-items:center}
.vazio{color:var(--mut);font-size:13px;padding:6px 0}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
#qrBox{display:none;align-items:center;text-align:center}
#qrBox img{width:240px;height:240px;background:#fff;border-radius:12px;padding:10px}
#msg{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--card2);border:1px solid var(--line);padding:11px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:90vw}
#msg.show{opacity:1;transform:translate(-50%,0)}#msg.ok{border-color:var(--ok)}#msg.erro{border-color:var(--bad)}
dialog{margin:auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:17px;margin-bottom:14px}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
.linha{display:flex;gap:8px;align-items:center}
.rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#gLista{max-height:46vh;overflow:auto;margin-top:10px}
.gi{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.gi input{width:auto}.gi span:first-of-type{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}.chk input{width:auto}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Assopra <em>Fitas</em></h1>
      <div class="atual" id="atualizado">Carregando…</div>
    </div>
    <div class="acoes">
      <button class="btn ic" id="btnAtualizar" title="Atualizar">↻</button>
      <button class="btn ic" id="btnConfig" title="Ajustes">⚙</button>
    </div>
  </header>

  <section class="grid">
    <div class="card c3"><span class="rot">WhatsApp</span><div class="val"><span class="dot" id="whatsDot"></span><span id="whatsTxt">—</span></div><div class="sub" id="whatsSub"></div></div>
    <div class="card c3"><span class="rot">Agenda</span><div class="val"><span class="dot" id="agDot"></span><span id="agTxt">—</span></div><div class="sub" id="agSub"></div></div>
    <div class="card c3"><span class="rot">Hoje</span><div class="val"><span id="hoje">0</span><small>/ <span id="meta">—</span></small></div><div class="barra"><i id="barra"></i></div></div>
    <div class="card c3"><span class="rot">Fila</span><div class="val"><span id="fila">0</span><small>novas · <span id="repost">0</span> reposts</small></div><div class="sub"></div></div>
  </section>

  <section class="card" style="margin-bottom:var(--gap)">
    <div class="acoes">
      <button class="btn pri" id="btnDisparar">▶ Disparar agora</button>
      <button class="btn" id="btnPausar">❚❚ Pausar</button>
      <button class="btn" id="btnSimular">Simular</button>
      <span class="sep"></span>
      <button class="btn" id="btnGrupos">Destinos</button>
      <button class="btn" id="btnConectar">Reconectar</button>
      <button class="btn" id="btnTrocar">Trocar número</button>
    </div>
  </section>

  <section class="card" id="qrBox" style="margin-bottom:var(--gap)">
    <span class="rot">Leia no WhatsApp › Aparelhos conectados</span>
    <img id="qrImg" alt="QR Code">
  </section>

  <section class="grid">
    <div class="card c7">
      <span class="rot">Últimos envios</span>
      <table><tbody id="tbEnvios"><tr><td class="vazio">—</td></tr></tbody></table>
    </div>
    <div class="c5" style="display:flex;flex-direction:column;gap:var(--gap)">
      <div class="card">
        <div class="cab"><span class="rot">Enquetes</span><button class="btn min" id="btnNovaEnq">+ Nova</button></div>
        <div class="lista" id="lsEnq"><div class="vazio">—</div></div>
      </div>
      <div class="card">
        <span class="rot">Destinos</span>
        <div class="lista" id="lsGrupos"><div class="vazio">—</div></div>
      </div>
    </div>
  </section>
</main>
<div id="msg"></div>

<dialog id="dlgGrupos">
  <h2>Destinos</h2>
  <input id="gBusca" placeholder="Buscar">
  <div id="gLista"></div>
  <label class="f">Adicionar canal</label>
  <div class="linha"><input id="gCanal" placeholder="https://whatsapp.com/channel/…"><button class="btn" id="gAddCanal">Adicionar</button></div>
  <div class="rodape"><button class="btn" id="gFechar">Cancelar</button><button class="btn pri" id="gSalvar">Salvar</button></div>
</dialog>

<dialog id="dlgEnq">
  <h2 id="eTit">Enquete</h2>
  <label class="f">Pergunta</label>
  <input id="eP" maxlength="255">
  <label class="f">Opções (uma por linha)</label>
  <textarea id="eO"></textarea>
  <div class="linha" style="margin-top:4px">
    <div style="flex:1"><label class="f">Data</label><input id="eD" type="date"></div>
    <div style="flex:1"><label class="f">Hora</label><input id="eH" type="time" value="12:00"></div>
  </div>
  <label class="chk"><input type="checkbox" id="eV"> Várias respostas</label>
  <label class="chk"><input type="checkbox" id="eR"> Pronta (sai sozinha na data e hora)</label>
  <div class="rodape"><button class="btn" id="eFechar">Cancelar</button><span class="sep"></span><button class="btn" id="eEnviar">Enviar agora</button><button class="btn pri" id="eSalvar">Salvar</button></div>
</dialog>

<dialog id="dlgConfig">
  <h2>Ajustes</h2>
  <label class="f">Senha do painel</label>
  <input id="cfgSenha" type="password" autocomplete="current-password">
  <label class="f">Chave de acesso</label>
  <div class="linha"><input id="cfgToken" type="password"><button class="btn" id="cfgVer" type="button">👁</button></div>
  <div class="rodape"><button class="btn" id="cfgSair">Sair</button><span class="sep"></span><button class="btn pri" id="cfgSalvar">Salvar</button></div>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const REPO = 'brunoalmaz/auto-achadinhos';
  const PAINEL = 'brunoalmaz/achadinhos-painel';
  const WF = { disparo: 'disparo.yml', conectar: 'conectar.yml', grupos: 'grupos.yml', enquete: 'enquete.yml', editar: 'editar-enquete.yml' };
  const BOTOES = ['btnDisparar', 'btnSimular', 'btnConectar', 'btnTrocar', 'btnPausar', 'btnGrupos', 'btnNovaEnq'];
  let S = null, ativo = null, timer = null, sintonizando = 0;

  const ls = {
    get: (k) => { try { return localStorage.getItem('achadinhos.' + k) || ''; } catch { return ''; } },
    set: (k, v) => { try { localStorage.setItem('achadinhos.' + k, v); } catch {} },
    limpar: () => { try { Object.keys(localStorage).filter((k) => k.startsWith('achadinhos.')).forEach((k) => localStorage.removeItem(k)); } catch {} },
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function aviso(t, tipo = '', seg = 5) { const m = $('msg'); m.className = tipo + ' show'; m.textContent = t; clearTimeout(aviso.t); aviso.t = setTimeout(() => m.classList.remove('show'), seg * 1000); }

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let chaveCache = null;
  async function abrir(p, senha) {
    const id = senha + p.sal;
    if (!chaveCache || chaveCache.id !== id) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
      chaveCache = { id, k: await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.sal), iterations: p.iteracoes, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']) };
    }
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, chaveCache.k, b64(p.dados))));
  }
  async function lerStatus() {
    const token = ls.get('token');
    let r = null;
    if (token) {
      try {
        r = await fetch(`https://api.github.com/repos/${PAINEL}/contents/status.json?t=${Date.now()}`, { cache: 'no-store', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw+json' } });
        if (!r.ok) r = null;
      } catch { r = null; }
    }
    if (!r) r = await fetch(`https://brunoalmaz.github.io/achadinhos-painel/status.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('Sem dados ainda');
    const j = await r.json();
    if (!j.criptografado) return j;
    const senha = ls.get('senha');
    if (!senha) throw new Error('SEM_SENHA');
    try { return Object.assign({}, j, await abrir(j.criptografado, senha)); } catch { throw new Error('SENHA_ERRADA'); }
  }

  async function api(caminho, op = {}) {
    const token = ls.get('token');
    if (!token) throw new Error('Coloque a chave de acesso em ⚙');
    const r = await fetch(`https://api.github.com/repos/${REPO}${caminho}`, { ...op, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', ...(op.headers || {}) } });
    if (r.status === 401) throw new Error('Chave de acesso inválida');
    if (!r.ok) throw new Error('Não foi possível (' + r.status + ')');
    return r.status === 204 ? null : r.json();
  }
  async function rodar(wf, inputs, ok) {
    try { await api(`/actions/workflows/${wf}/dispatches`, { method: 'POST', body: JSON.stringify({ ref: 'main', inputs }) }); aviso(ok, 'ok'); setTimeout(atualizar, 5000); }
    catch (e) { aviso(e.message, 'erro'); }
  }

  const WH = { CONECTADO: ['Conectado', 'ok'], DESCONECTADO: ['Desconectado', 'bad'], AGUARDANDO_QR: ['Aguardando QR', 'warn'] };
  const ENQ_OK = (e) => e.status === 'ENVIADA';

  function pintar(s) {
    S = s;
    $('atualizado').textContent = s.atualizado_em ? 'Atualizado ' + s.atualizado_em.slice(0, 16) : '';
    const [wt, wc] = WH[s.whatsapp] || ['—', ''];
    $('whatsTxt').textContent = wt; $('whatsDot').className = 'dot ' + wc;
    $('whatsSub').textContent = (s.grupos || []).filter((g) => g.ativo).length + ' destinos';
    const hoje = s.enviados_hoje || 0, meta = s.meta_dia || 0;
    $('hoje').textContent = hoje; $('meta').textContent = meta || '—';
    $('barra').style.width = (meta ? Math.min(100, hoje / meta * 100) : 0) + '%';
    $('fila').textContent = s.fila_novas ?? 0; $('repost').textContent = s.repost_disponiveis ?? 0;
    const ex = s.ultima_execucao || {};
    const prox = String(ex.resultado || '').startsWith('⏳') ? ex.resultado.replace('⏳ ', 'Próximo: ').replace(/\d+º achadinho às /, '') : '';
    $('agSub').textContent = prox;

    const qr = s.whatsapp === 'AGUARDANDO_QR' && s.qr;
    if (s.whatsapp === 'CONECTADO') sintonizando = 0;
    $('qrBox').style.display = qr || Date.now() < sintonizando ? 'flex' : 'none';
    if (qr && $('qrImg').src !== s.qr) $('qrImg').src = s.qr;

    const env = s.ultimos_envios || [];
    $('tbEnvios').innerHTML = env.length ? env.map((e) => `<tr><td class="q">${esc(String(e.dataHora).slice(0, 16))}</td><td class="p" title="${esc(e.produto)}">${esc(e.produto)}</td><td class="q">${esc(e.destino)}</td><td class="q"><span class="tag ${e.resultado === 'ERRO' ? 'bad' : e.resultado === 'ENQUETE' ? 'pk' : 'ok'}">${e.resultado === 'ENQUETE' ? 'enquete' : e.resultado === 'OK' ? 'ok' : 'erro'}</span></td></tr>`).join('')
      : '<tr><td class="vazio">Nenhum envio</td></tr>';

    const gr = (s.grupos || []).filter((g) => g.ativo);
    $('lsGrupos').innerHTML = gr.length ? gr.map((g) => `<div class="it"><span class="n">${esc(g.nome)}</span><span class="tag">${g.tipo === 'CANAL' ? 'canal' : g.tipo === 'COMUNIDADE' ? 'comunidade' : 'grupo'}</span></div>`).join('') : '<div class="vazio">Nenhum</div>';

    const ord = (e) => { const m = String(e.data).match(/(\d+)\/(\d+)\/(\d+)/); return m ? `${m[3]}${m[2].padStart(2, '0')}${m[1].padStart(2, '0')}${e.hora || ''}` : '9'; };
    const enq = (s.enquetes || []).filter((e) => !ENQ_OK(e)).sort((a, b) => ord(a).localeCompare(ord(b))).slice(0, 6);
    $('lsEnq').innerHTML = enq.length ? enq.map((e) => `<div class="it"><span style="min-width:0;flex:1"><div class="n" title="${esc(e.pergunta)}">${esc(e.pergunta)}</div><div class="d">${e.data ? esc(String(e.data).slice(0, 5)) + ' · ' + esc(String(e.hora || '').slice(0, 5)) : 'sem data'} ${e.pronta ? '<span class="tag ok">pronta</span>' : ''}</div></span><button class="btn min" data-ed="${e.linha}">Editar</button><button class="btn min" data-enq="${e.linha}">Enviar</button></div>`).join('') : '<div class="vazio">Nenhuma pendente</div>';
  }

  async function agenda() {
    const tem = Boolean(ls.get('token'));
    BOTOES.forEach((id) => { $(id).disabled = !tem; });
    if (!tem) { $('agTxt').textContent = '—'; $('agDot').className = 'dot'; return; }
    const wf = await api(`/actions/workflows/${WF.disparo}`);
    ativo = wf.state === 'active';
    $('agTxt').textContent = ativo ? 'Ativa' : 'Pausada'; $('agDot').className = 'dot ' + (ativo ? 'ok' : 'warn');
    $('btnPausar').textContent = ativo ? '❚❚ Pausar' : '▶ Retomar';
    $('btnPausar').className = 'btn ' + (ativo ? 'warn' : 'okc');
  }

  async function atualizar() {
    clearTimeout(timer);
    try { pintar(await lerStatus()); }
    catch (e) {
      $('atualizado').textContent = e.message === 'SEM_SENHA' ? 'Coloque a senha em ⚙' : e.message === 'SENHA_ERRADA' ? 'Senha incorreta' : e.message;
      if (e.message === 'SEM_SENHA' && !$('dlgConfig').open) abrirConfig();
    }
    try { await agenda(); } catch (e) { aviso(e.message, 'erro'); }
    timer = setTimeout(atualizar, (S?.whatsapp === 'AGUARDANDO_QR' || Date.now() < sintonizando) ? 5000 : 30000);
  }

  $('btnDisparar').onclick = () => confirm('Disparar uma oferta agora?') && rodar(WF.disparo, { forcar: true, teste: false }, 'Disparando');
  $('btnSimular').onclick = () => rodar(WF.disparo, { forcar: true, teste: true }, 'Simulação iniciada');
  const qrEspera = () => { sintonizando = Date.now() + 6 * 60_000; $('qrImg').removeAttribute('src'); $('qrBox').style.display = 'flex'; };
  $('btnConectar').onclick = () => { qrEspera(); rodar(WF.conectar, { nova_sessao: false }, 'Reconectando'); };
  $('btnTrocar').onclick = () => confirm('Trocar o número conectado?') && (qrEspera(), rodar(WF.conectar, { nova_sessao: true }, 'Gerando QR'));
  $('btnPausar').onclick = async () => {
    if (ativo && !confirm('Pausar os disparos?')) return;
    try { await api(`/actions/workflows/${WF.disparo}/${ativo ? 'disable' : 'enable'}`, { method: 'PUT' }); aviso(ativo ? 'Pausado' : 'Retomado', 'ok'); agenda(); }
    catch (e) { aviso(e.message, 'erro'); }
  };

  // Destinos
  let marcados = new Set();
  function listarG() {
    const q = $('gBusca').value.trim().toLowerCase();
    $('gLista').innerHTML = (S?.disponiveis || []).filter((d) => !q || d.nome.toLowerCase().includes(q)).map((d) => `<label class="gi"><input type="checkbox" value="${esc(d.id)}" ${marcados.has(d.id) ? 'checked' : ''}><span>${esc(d.nome)}</span><span class="tag">${d.tipo === 'CANAL' ? 'canal' : d.tipo === 'COMUNIDADE' ? 'comunidade' : 'grupo'}</span></label>`).join('') || '<div class="vazio">Nada encontrado</div>';
  }
  $('gLista').onchange = (e) => { if (e.target.checked) marcados.add(e.target.value); else marcados.delete(e.target.value); };
  $('btnGrupos').onclick = () => {
    if (!S?.disponiveis?.length) return aviso('Clique em Reconectar e tente de novo', 'erro');
    marcados = new Set((S.grupos || []).filter((g) => g.ativo && g.id).map((g) => g.id));
    $('gBusca').value = ''; listarG(); $('dlgGrupos').showModal();
  };
  $('gBusca').oninput = listarG;
  $('gFechar').onclick = () => $('dlgGrupos').close();
  $('gSalvar').onclick = () => { $('dlgGrupos').close(); rodar(WF.grupos, { selecao: JSON.stringify([...marcados]) }, 'Salvando destinos'); };
  $('gAddCanal').onclick = () => {
    const link = $('gCanal').value.trim();
    if (!/whatsapp\.com\/channel\/[\w-]+/.test(link)) return aviso('Link de canal inválido', 'erro');
    $('dlgGrupos').close(); rodar(WF.conectar, { nova_sessao: false, canal: link }, 'Adicionando canal');
  };

  // Enquetes
  let editando = 0;
  const isoData = (v) => { const m = String(v || '').match(/(\d+)\/(\d+)\/(\d+)/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : ''; };
  function abrirEnq(e) {
    editando = e ? e.linha : 0;
    $('eTit').textContent = e ? 'Editar enquete' : 'Nova enquete';
    $('eP').value = e?.pergunta || ''; $('eO').value = (e?.opcoes || []).join('\n');
    $('eD').value = isoData(e?.data); $('eH').value = String(e?.hora || '12:00').slice(0, 5);
    $('eV').checked = Boolean(e?.varias); $('eR').checked = Boolean(e?.pronta);
    $('dlgEnq').showModal();
  }
  function lerForm() {
    const pergunta = $('eP').value.trim(), opcoes = $('eO').value.split('\n').map((x) => x.trim()).filter(Boolean);
    if (!pergunta || opcoes.length < 2) { aviso('Pergunta e pelo menos 2 opções', 'erro'); return null; }
    if (opcoes.length > 12) { aviso('Máximo de 12 opções', 'erro'); return null; }
    const d = $('eD').value.split('-');
    return { linha: editando, pergunta, opcoes, varias: $('eV').checked, pronta: $('eR').checked, data: d.length === 3 ? `${d[2]}/${d[1]}/${d[0]}` : '', hora: $('eH').value };
  }
  $('lsEnq').onclick = (ev) => {
    const ed = ev.target.closest('[data-ed]'), en = ev.target.closest('[data-enq]');
    const id = ed ? ed.dataset.ed : en ? en.dataset.enq : null;
    const e = (S?.enquetes || []).find((x) => String(x.linha) === id);
    if (!e) return;
    if (ed) return abrirEnq(e);
    if (confirm(`Enviar agora?\n\n${e.pergunta}\n\n• ${e.opcoes.join('\n• ')}`)) rodar(WF.enquete, { enquete: String(e.linha) }, 'Enquete na fila');
  };
  $('btnNovaEnq').onclick = () => abrirEnq(null);
  $('eFechar').onclick = () => $('dlgEnq').close();
  $('eSalvar').onclick = () => {
    const f = lerForm(); if (!f) return;
    if (f.pronta && !f.data) return aviso('Coloque a data pra deixar pronta', 'erro');
    $('dlgEnq').close(); rodar(WF.editar, { enquete: JSON.stringify(f) }, 'Salvando enquete');
  };
  $('eEnviar').onclick = () => {
    const f = lerForm(); if (!f || !confirm('Enviar agora nos destinos?')) return;
    $('dlgEnq').close(); rodar(WF.enquete, { enquete: JSON.stringify(f) }, 'Enquete na fila');
  };

  // Ajustes
  function abrirConfig() { $('cfgSenha').value = ls.get('senha'); $('cfgToken').value = ls.get('token'); $('dlgConfig').showModal(); }
  $('btnConfig').onclick = abrirConfig;
  $('btnAtualizar').onclick = atualizar;
  $('cfgVer').onclick = () => { const i = $('cfgToken'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('cfgSalvar').onclick = () => { ls.set('senha', $('cfgSenha').value); ls.set('token', $('cfgToken').value.trim()); chaveCache = null; $('dlgConfig').close(); atualizar(); };
  $('cfgSair').onclick = () => { ls.limpar(); location.reload(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizar(); });

  atualizar();
})();
</script>
</body>
</html>
