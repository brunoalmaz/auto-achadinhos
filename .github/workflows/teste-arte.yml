name: Teste arte

on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Link do canal'
        type: string
        required: false
      fonte:
        description: 'cupons ou ofertas'
        type: string
        required: false
        default: 'ofertas'

concurrency:
  group: whatsapp
  cancel-in-progress: false

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Restaurar sessão do WhatsApp
        uses: actions/cache/restore@v4
        with:
          path: auth
          key: wa-auth-${{ github.run_id }}
          restore-keys: wa-auth-
      - name: Enviar
        run: node src/arteTeste.js
        env:
          DESTINO: ${{ inputs.destino }}
          FONTE: ${{ inputs.fonte }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
      - name: Salvar sessão do WhatsApp
        if: always() && hashFiles('auth/creds.json') != ''
        uses: actions/cache/save@v4
        with:
          path: auth
          key: wa-auth-${{ github.run_id }}-${{ github.run_attempt }}
