name: Salvar grupos

# Disparado pelo painel ("Escolher grupos"). Grava na aba Grupos os destinos marcados.
on:
  workflow_dispatch:
    inputs:
      selecao:
        description: 'IDs dos grupos escolhidos (JSON)'
        type: string
        required: true

jobs:
  grupos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --omit=dev --no-audit --no-fund

      - name: Salvar seleção
        run: node src/main.js
        env:
          MODO: grupos
          SELECAO: ${{ inputs.selecao }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          PANEL_SENHA: ${{ secrets.PANEL_SENHA }}
          PANEL_REPO: ${{ vars.PANEL_REPO }}
