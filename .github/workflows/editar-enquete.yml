name: Salvar enquete

on:
  workflow_dispatch:
    inputs:
      enquete:
        description: 'JSON da enquete'
        type: string
        required: true

jobs:
  enquete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Salvar enquete
        run: node src/main.js
        env:
          MODO: editar-enquete
          ENQUETE: ${{ inputs.enquete }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          PANEL_SENHA: ${{ secrets.PANEL_SENHA }}
          PANEL_REPO: ${{ vars.PANEL_REPO }}
